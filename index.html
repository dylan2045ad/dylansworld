<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dylan's World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: url('outputs/mini-3d-world/') center/cover no-repeat fixed;
            background-color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }
        
        /* Aerial city background fallback */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(100, 150, 200, 0.4) 0%, rgba(80, 120, 180, 0.4) 100%),
                        repeating-linear-gradient(90deg, #444 0px, #444 40px, #555 40px, #555 80px),
                        repeating-linear-gradient(0deg, #333 0px, #333 40px, #444 40px, #444 80px);
            background-size: 100% 100%, 400px 400px, 400px 400px;
            z-index: -1;
        }
        
        .container {
            text-align: left;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            padding: 50px 60px;
            border-radius: 0;
            box-shadow: none;
            max-width: 500px;
            border-left: 4px solid #90EE90;
        }
        
        h1 {
            color: #90EE90;
            margin-bottom: 10px;
            font-size: 2.5em;
            font-weight: 300;
            letter-spacing: 1px;
            line-height: 1.2;
        }
        
        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1em;
            margin-bottom: 30px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }
        
        p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.95em;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        
        .button {
            display: inline-block;
            background: rgba(144, 238, 144, 0.2);
            border: 1px solid #90EE90;
            color: #90EE90;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 2px;
            font-weight: 500;
            font-size: 0.9em;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }
        
        .button:hover {
            background: rgba(144, 238, 144, 0.3);
            box-shadow: 0 0 15px rgba(144, 238, 144, 0.5);
        }
        
        .button.primary {
            background: #90EE90;
            color: #1a1a1a;
        }
        
        .button.primary:hover {
            background: #7FDD7F;
            box-shadow: 0 0 20px rgba(144, 238, 144, 0.7);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dylan's<br>World</h1>
        <p class="subtitle">Explore an interactive 3D city environment</p>
        
        <p>Welcome to Dylan's World - an immersive aerial city experience built with Three.js and deployed on GitHub Pages.</p>
        
        <div class="button-group">
            <a href="outputs/mini-3d-world/" class="button primary">Explore Now</a>
            <a href="https://github.com/dylan2045ad/dylansworld" class="button">View Source</a>
        </div>
    </div>
</body>
</html>
